version: '3.8'

services:
  vllm-worker:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RUNPOD_AI_API_KEY=test_key
      - RUNPOD_WEBHOOK_URL=http://localhost:8000/webhook
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    volumes:
      # 로컬 테스트 서버 마운트
      - ./local_test_server.py:/app/local_test_server.py
      # LoRA 어댑터 디렉토리 (있는 경우)
      - ./lora_adapters:/app/lora_adapters
    # GPU 사용 (NVIDIA Docker 필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # 로컬 테스트 서버로 실행
    command: python3 local_test_server.py